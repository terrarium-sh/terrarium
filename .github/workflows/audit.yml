# Weekly RustSec advisory audit of every committed lockfile.
name: Security audit

on:
  schedule:
    - cron: '23 4 * * 1'
  push:
    paths:
      - '**/Cargo.lock'
      - '**/Cargo.toml'

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install cargo-audit --version 0.22.0 --locked
      - run: |
          find . -name Cargo.lock -print0 | while IFS= read -r -d '' lockfile; do
            cargo audit --file "$lockfile"
          done
