# Weekly RustSec advisory audit of Cargo.lock, plus an audit on every push
# that touches it. No submodules and no build: this reads the lockfile only.
name: Security audit

on:
  schedule:
    - cron: '23 4 * * 1'
  push:
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # A scheduled hit files an issue; every run records a check.
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
