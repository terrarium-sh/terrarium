name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native_vm_tests:
        description: Run macOS and Windows VM gates (requires hypervisor access on the runners)
        type: boolean
        default: false
  workflow_call:
    inputs:
      native_vm_tests:
        description: Run macOS and Windows VM gates
        type: boolean
        default: false
      release_sources:
        description: Assemble source archives for release publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install component formatter
        run: rustup toolchain install nightly-2026-09-16 --profile minimal --component rustfmt
      - run: make KEEP_GOING=1 verify-source

  guest-assets:
    name: Linux guest (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            rust_target: x86_64-unknown-linux-musl
          - arch: aarch64
            rust_target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup /usr/local/share/boost
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -U -r true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - run: rustup target add ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: ${{ matrix.arch }}-guest
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build
          key: guest-${{ matrix.arch }}-${{ hashFiles('pins.mk', 'Makefile', 'kernel/Containerfile', 'kernel/*.config', 'kernel/patches/*.patch', 'scripts/kernel-container.sh', 'scripts/*.py') }}
      - name: Build guest assets
        run: make ARCH=${{ matrix.arch }} guest-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terra-guest-${{ matrix.arch }}
          path: |
            build/vmlinux.gz
            build/rootfs.img.gz
            build/volume.img.gz
            build/boot.img.gz
          if-no-files-found: error
          compression-level: 0

      - name: Assemble release sources
        if: ${{ inputs.release_sources }}
        run: |
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            make ARCH=x86_64 source-dist
          else
            scripts/alpine-sources.sh
            mv build/alpine-corresponding-source.tar.gz build/terra-alpine-aarch64-source.tar.gz
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.release_sources && matrix.arch == 'x86_64' }}
        with:
          name: terra-source
          path: build/terra-source.tar.gz
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.release_sources && matrix.arch == 'aarch64' }}
        with:
          name: terra-alpine-source-aarch64
          path: build/terra-alpine-aarch64-source.tar.gz
          if-no-files-found: error
          compression-level: 0

  linux-x86_64:
    name: Build Linux (x86_64)
    needs: guest-assets
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup /usr/local/share/boost
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -U -r true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Install component toolchain
        run: |
          rustup toolchain install nightly-2026-09-16 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-on-failure: true
          workspaces: . -> target
          key: x86_64-linux
      - name: Install wasm-tools
        run: |
          cargo install wasm-tools --version 1.248.0 --locked --target "$(rustc -vV | sed -n 's/^host: //p')"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-guest-x86_64
          path: build
      - name: Build host
        id: host-build
        run: make host-dist
      - name: Verify host
        if: ${{ !cancelled() && steps.host-build.outcome == 'success' }}
        run: make --keep-going KEEP_GOING=1 verify-host-components verify-workspace
      - name: Check platform on Windows
        if: ${{ !cancelled() && steps.host-build.outcome == 'success' }}
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo check --locked --all-targets -p terra-platform --target x86_64-pc-windows-gnu
      - name: Check distribution
        run: |
          ./dist/terra --version
          ./dist/terra --help
          file ./dist/terra | grep -q 'statically linked'
          ! ldd ./dist/terra 2>&1 | grep -q '=>'
      - name: Network policy coverage
        if: ${{ !cancelled() && steps.host-build.outcome == 'success' }}
        run: |
          rustup component add llvm-tools-preview
          llvm_bin="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin"
          LLVM_COV="$llvm_bin/llvm-cov" LLVM_PROFDATA="$llvm_bin/llvm-profdata" python3 scripts/coverage-network-policy.py
      - name: KVM gates
        if: ${{ !cancelled() && steps.host-build.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo '::notice title=KVM gates skipped::This hosted runner has no read/write /dev/kvm.'
            exit 0
          fi
          status=0
          TERRA_BIN="$PWD/dist/terra" cargo test --no-fail-fast --locked --target x86_64-unknown-linux-musl -p terra --test native_boot native_boot_executes_shell -- --ignored --test-threads=1 --nocapture || status=1
          TERRA_BIN="$PWD/dist/terra" cargo test --no-fail-fast --locked --target x86_64-unknown-linux-musl -p terra --test native_boot native_boot_forwards_shared_file_events -- --ignored --test-threads=1 --nocapture || status=1
          cargo test --no-fail-fast --locked --target x86_64-unknown-linux-musl -p terra-runtime --lib -- --ignored --test-threads=1 || status=1
          cargo test --no-fail-fast --locked --target x86_64-unknown-linux-musl -p terra-platform --test native_vm -- --ignored --test-threads=1 || status=1
          cargo test --no-fail-fast --locked --target x86_64-unknown-linux-musl -p terra-platform --lib cpuid_matches_the_fixed_vcpu_count -- --ignored --test-threads=1 || status=1
          TERRA_BIN="$PWD/dist/terra" cargo test --no-fail-fast --locked --target x86_64-unknown-linux-musl -p terra --test boot --test memory -- --ignored --test-threads=1 || status=1
          exit "$status"
      - name: Reclaim component build space
        if: ${{ !cancelled() }}
        run: rm -rf components/target
      - name: Fuzz smoke
        if: ${{ !cancelled() && steps.host-build.outcome == 'success' }}
        run: |
          cargo install cargo-fuzz --version 0.13.1 --locked --target "$(rustc -vV | sed -n 's/^host: //p')"
          cargo metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1
          status=0
          cargo +nightly-2026-09-16 fuzz run network_policy -- -max_total_time=60 -max_len=4096 || status=1
          cargo +nightly-2026-09-16 fuzz run native_memory -- -max_total_time=60 -max_len=32768 || status=1
          cargo +nightly-2026-09-16 fuzz run device_queue -- -max_total_time=60 -max_len=4096 || status=1
          cargo +nightly-2026-09-16 fuzz run fuse_wire -- -max_total_time=60 -max_len=4096 || status=1
          cargo +nightly-2026-09-16 fuzz run vsock_header -- -max_total_time=60 -max_len=4096 || status=1
          cargo +nightly-2026-09-16 fuzz run protocol_frames -- -max_total_time=60 -max_len=4096 || status=1
          exit "$status"
      - name: Reclaim fuzz build space
        if: ${{ !cancelled() }}
        run: rm -rf fuzz/target
      - name: Native boundary address sanitizer
        if: ${{ !cancelled() && steps.host-build.outcome == 'success' }}
        env:
          RUSTFLAGS: -Zsanitizer=address
          CARGO_TARGET_DIR: target/asan
        run: cargo +nightly-2026-09-16 test --no-fail-fast --locked -p terra-runtime --test native_boundary --target x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terra-x86_64-linux
          path: dist

  linux-aarch64:
    name: Build Linux (aarch64)
    needs: guest-assets
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup /usr/local/share/boost
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -U -r true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-guest-aarch64
          path: build
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Install component toolchain
        run: |
          rustup target add aarch64-unknown-linux-musl
          rustup toolchain install nightly-2026-09-16 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-on-failure: true
          workspaces: |
            .
            components
          key: aarch64-linux
      - name: Install wasm-tools
        run: |
          cargo install wasm-tools --version 1.248.0 --locked --target "$(rustc -vV | sed -n 's/^host: //p')"
      - name: Build native ARM target
        id: host-build
        run: make host-dist
      - name: Verify native ARM target
        if: ${{ !cancelled() && steps.host-build.outcome == 'success' }}
        run: |
          status=0
          make KEEP_GOING=1 verify-host-components || status=1
          cargo fmt --all -- --check || status=1
          cargo clippy --locked --workspace --all-targets --target aarch64-unknown-linux-musl -- -D warnings || status=1
          cargo test --no-fail-fast --locked --target aarch64-unknown-linux-musl --workspace || status=1
          exit "$status"
      - name: Check distribution
        if: ${{ !cancelled() && steps.host-build.outcome == 'success' }}
        run: |
          ./dist/terra --version
          ./dist/terra --help
      - name: KVM product gates
        if: ${{ !cancelled() && steps.host-build.outcome == 'success' }}
        run: |
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo '::notice title=KVM gates skipped::This hosted runner has no read/write /dev/kvm.'
            exit 0
          fi
          status=0
          cargo test --no-fail-fast --locked --target aarch64-unknown-linux-musl -p terra-runtime --lib -- --ignored --test-threads=1 || status=1
          cargo test --no-fail-fast --locked --target aarch64-unknown-linux-musl -p terra-platform --test native_vm -- --ignored --test-threads=1 || status=1
          TERRA_BIN="$PWD/dist/terra" cargo test --no-fail-fast --locked --target aarch64-unknown-linux-musl -p terra --test native_boot native_boot_forwards_shared_file_events -- --ignored --test-threads=1 --nocapture || status=1
          TERRA_BIN="$PWD/dist/terra" cargo test --no-fail-fast --locked --target aarch64-unknown-linux-musl -p terra --test boot --test memory -- --ignored --test-threads=1 || status=1
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terra-aarch64-linux
          path: dist

  macos-aarch64:
    name: Build macOS (aarch64)
    needs: guest-assets
    if: ${{ !cancelled() }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-guest-aarch64
          path: build
      - name: Install component toolchain
        run: |
          rustup toolchain install nightly-2026-09-16 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-on-failure: true
          workspaces: |
            .
            components
          key: aarch64-macos
      - name: Install wasm-tools
        run: |
          cargo install wasm-tools --version 1.248.0 --locked --target "$(rustc -vV | sed -n 's/^host: //p')"
      - name: Build and sign
        id: host-build
        run: |
          make TERRA_TARGET=aarch64-apple-darwin host-dist
          codesign --force --sign - --entitlements packaging/macos.entitlements dist/terra
          codesign --verify --strict --verbose=2 dist/terra
          ./dist/terra --version
          ./dist/terra --help
      - name: Check native target
        if: ${{ !cancelled() && steps.host-build.outcome == 'success' }}
        run: cargo clippy --locked --workspace --all-targets --target aarch64-apple-darwin -- -D warnings
      - name: Run workspace unit tests
        if: ${{ !cancelled() && steps.host-build.outcome == 'success' }}
        run: cargo test --no-fail-fast --locked --target aarch64-apple-darwin --workspace
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: ${{ !cancelled() && steps.host-build.outcome == 'success' && (inputs.native_vm_tests || matrix.native_vm_tests) }}
        with:
          version: 0.16.0
      - name: Native VM acceptance
        if: ${{ !cancelled() && steps.host-build.outcome == 'success' && (inputs.native_vm_tests || matrix.native_vm_tests) }}
        run: |
          CARGO_TARGET_AARCH64_APPLE_DARWIN_RUNNER="sh scripts/run-macos-vm-test" cargo test --no-fail-fast --locked --target aarch64-apple-darwin -p terra-platform --test native_vm -- --ignored --test-threads=1
          TERRA_BIN="$PWD/dist/terra" cargo test --no-fail-fast --locked --target aarch64-apple-darwin -p terra --test native_boot --test boot --test memory -- --ignored --test-threads=1 --nocapture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terra-aarch64-macos
          path: dist

  windows:
    name: Build Windows (${{ matrix.guest }})
    needs: guest-assets
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ${{ vars.WINDOWS_X64_VM_RUNNER || 'windows-2025' }}
            target: x86_64-pc-windows-msvc
            guest: x86_64
            native_vm_tests: ${{ vars.WINDOWS_X64_VM_RUNNER != '' }}
          - runner: ${{ vars.WINDOWS_ARM64_VM_RUNNER || 'windows-11-arm' }}
            target: aarch64-pc-windows-msvc
            guest: aarch64
            native_vm_tests: ${{ vars.WINDOWS_ARM64_VM_RUNNER != '' }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Enable Git symlinks
        run: git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-guest-${{ matrix.guest }}
          path: build
      - name: Install component toolchain
        run: rustup toolchain install nightly-2026-09-16 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-on-failure: true
          workspaces: |
            .
            components
          key: ${{ matrix.target }}
      - name: Build distribution
        id: host-build
        shell: pwsh
        run: ./scripts/build-host.ps1 -Target ${{ matrix.target }}
      - name: Check native target
        shell: pwsh
        run: |
          cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Run workspace unit tests
        if: ${{ !cancelled() && steps.host-build.outcome == 'success' }}
        shell: pwsh
        run: cargo test --locked --target ${{ matrix.target }} --workspace --no-fail-fast
      - name: Check distribution
        shell: pwsh
        run: |
          ./dist/terra.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist/terra.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native VM lifecycle
        if: ${{ !cancelled() && steps.host-build.outcome == 'success' && (inputs.native_vm_tests || matrix.native_vm_tests) }}
        timeout-minutes: 5
        shell: pwsh
        run: cargo test --no-fail-fast --locked --target ${{ matrix.target }} -p terra-platform --test native_vm -- --ignored --test-threads=1
      - name: Native boot and shell gate
        if: ${{ !cancelled() && steps.host-build.outcome == 'success' && (inputs.native_vm_tests || matrix.native_vm_tests) }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          $env:TERRA_BIN = (Resolve-Path ./dist/terra.exe).Path
          cargo test --no-fail-fast --locked --target ${{ matrix.target }} -p terra --test native_boot native_boot_executes_shell -- --ignored --test-threads=1 --nocapture
      - name: Report Windows boot coverage
        if: ${{ !(inputs.native_vm_tests || matrix.native_vm_tests) }}
        shell: pwsh
        run: |
          '### Windows boot was not tested' >> $env:GITHUB_STEP_SUMMARY
          'Set WINDOWS_X64_VM_RUNNER or WINDOWS_ARM64_VM_RUNNER to a runner label with working WHP to enable the required boot and shell gate.' >> $env:GITHUB_STEP_SUMMARY
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: ${{ !cancelled() && steps.host-build.outcome == 'success' && inputs.native_vm_tests }}
        with:
          version: 0.16.0
      - name: Native VM acceptance
        if: ${{ !cancelled() && steps.host-build.outcome == 'success' && inputs.native_vm_tests }}
        shell: pwsh
        run: |
          $env:TERRA_BIN = (Resolve-Path ./dist/terra.exe).Path
          cargo test --no-fail-fast --locked --target ${{ matrix.target }} -p terra --test native_boot --test boot --test memory -- --ignored --test-threads=1 --nocapture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terra-${{ matrix.target }}
          path: dist
