# Temporary CI. Builds nothing but the binary, so it needs no /dev/kvm and runs
# on stock hosted runners. The real pipeline (fmt, clippy, tests, the boot suite
# against a live microVM, the macOS job) is parked in ci.yml.disabled — restore
# it once there is a runner that can boot a guest.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions pinned by commit SHA, not tag: setup-zig supplies the C compiler and
# linker for the whole static build. The trailing comment is the tag the SHA
# stood for — update both together.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          # Native, not cross: the guest kernel, rootfs and agent are built for
          # the host arch (see ARCH in the Makefile), so an arm binary has to be
          # produced on arm hardware to embed a guest it can actually boot.
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # One level only. vendor/smolvm has its own submodules on ssh URLs
          # that this build never touches, and recursing would fail to fetch them.
          submodules: true
          persist-credentials: false
      # A full Linux kernel build needs these; ubuntu-latest happens to carry
      # them, the arm image does not, so install on both rather than depend on
      # which runner image ships what.
      - name: Kernel build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            flex bison bc libelf-dev libssl-dev python3-pyelftools
      # `mke2fs -d` bakes the rootfs and boot images root-owned inside a user
      # namespace (see the Makefile), so the build needs to be able to map root
      # in one. Ubuntu 24.04 — both runner images — ships
      # kernel.apparmor_restrict_unprivileged_userns=1, which lets the namespace
      # be created but strips the capabilities inside it, so the uid_map write
      # fails with EPERM instead of unshare failing outright. Runners are
      # throwaway VMs, so just turn it off; the guard keeps this working on an
      # image that has no such knob.
      #
      # `unshare -U -r true` is the point of the step, not a formality: without
      # it the first thing to need a namespace is the rootfs bake, ~20 minutes
      # of kernel build later.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -U -r true
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: . -> target
          key: ${{ matrix.arch }}
      # .cargo/config.toml routes CC and the musl linker through scripts/zig-*.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      # The guest kernel is a full Linux build — minutes — and its only inputs
      # are the libkrunfw submodule, the pins, the hardening fragment and the
      # host arch. All four are in the key, so a pin bump or an arch switch
      # cannot hit a stale image (the Makefile's pin stamp enforces the same
      # thing locally). pins.mk especially: that is where a security bump lands.
      - name: Guest image inputs
        id: guest
        run: >-
          echo "key=${{ matrix.arch }}-$(git rev-parse HEAD:vendor/libkrunfw)-${{
          hashFiles('pins.mk', 'Makefile', 'kernel/terrarium-hardening.config') }}"
          >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build
          key: guest-${{ steps.guest.outputs.key }}
      # Bakes the guest images (needs unprivileged user namespaces, which hosted
      # runners have) and links the one static binary.
      - name: Build
        run: make dist
      - name: Check it runs
        run: |
          ./dist/terra --version
          ./dist/terra --help
      # The whole point of the static build — a dynamic dependency here means a
      # tester's box has to happen to match this runner's libc.
      - name: Check it is static
        run: |
          file ./dist/terra | grep -q 'statically linked'
          ! ldd ./dist/terra 2>&1 | grep -q '=>'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terra-${{ matrix.arch }}-linux
          path: dist/terra
      - if: matrix.arch == 'aarch64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guest-images-aarch64
          path: |
            build/*.gz
            build/*.sha256
          retention-days: 7

  macos:
    runs-on: macos-latest
    needs: build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: . -> target
          key: macos
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: guest-images-aarch64
          path: build
      - name: Build
        run: cargo build --release -p terra --target aarch64-apple-darwin
      - name: Check it runs
        run: |
          ./target/aarch64-apple-darwin/release/terra --version
          ./target/aarch64-apple-darwin/release/terra --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terra-aarch64-macos
          path: target/aarch64-apple-darwin/release/terra
