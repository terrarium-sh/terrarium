name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native_vm_tests:
        description: Run macOS and Windows VM gates (requires hypervisor access on the runners)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  guest-assets:
    name: Linux guest (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            rust_target: x86_64-unknown-linux-musl
          - arch: aarch64
            rust_target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -U -r true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - run: rustup target add ${{ matrix.rust_target }}
      - name: Build guest assets
        run: make ARCH=${{ matrix.arch }} guest-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terra-guest-${{ matrix.arch }}
          path: |
            build/vmlinux.gz
            build/rootfs.img.gz
            build/volume.img.gz
            build/boot.img.gz
            build/vmlinux.gz.sha256
            build/boot.img.gz.sha256
          if-no-files-found: error

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -U -r true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Install component build tools
        run: |
          rustup toolchain install nightly-2026-09-13 --profile minimal --component rustfmt,clippy --target wasm32-wasip3
          cargo install wasm-tools --version 1.248.0 --locked --target "$(rustc -vV | sed -n 's/^host: //p')"
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: . -> target
          key: x86_64-component
      - name: Guest image cache key
        id: guest
        run: >-
          echo "key=${{ hashFiles('pins.mk', 'Makefile', 'kernel/Containerfile', 'kernel/*.config', 'kernel/patches/*.patch', 'scripts/kernel-container.sh', 'scripts/*.py') }}"
          >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build
          key: guest-${{ steps.guest.outputs.key }}
      - name: Verify
        run: make verify
      - name: Build distribution
        run: make dist
      - name: Check distribution
        run: |
          ./dist/terra --version
          ./dist/terra --help
          file ./dist/terra | grep -q 'statically linked'
          ! ldd ./dist/terra 2>&1 | grep -q '=>'
      - name: Network policy coverage
        run: |
          rustup component add llvm-tools-preview
          llvm_bin="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin"
          LLVM_COV="$llvm_bin/llvm-cov" LLVM_PROFDATA="$llvm_bin/llvm-profdata" python3 scripts/coverage-network-policy.py
      - name: Fuzz smoke
        run: |
          cargo install cargo-fuzz --version 0.13.1 --locked --target "$(rustc -vV | sed -n 's/^host: //p')"
          cargo metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1
          cargo +nightly-2026-09-13 fuzz run network_policy -- -max_total_time=60 -max_len=4096
          cargo +nightly-2026-09-13 fuzz run native_memory -- -max_total_time=60 -max_len=32768
          cargo +nightly-2026-09-13 fuzz run device_queue -- -max_total_time=60 -max_len=4096
          cargo +nightly-2026-09-13 fuzz run fuse_wire -- -max_total_time=60 -max_len=4096
          cargo +nightly-2026-09-13 fuzz run vsock_header -- -max_total_time=60 -max_len=4096
          cargo +nightly-2026-09-13 fuzz run protocol_frames -- -max_total_time=60 -max_len=4096
      - name: Native boundary address sanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          CARGO_TARGET_DIR: target/asan
        run: cargo +nightly-2026-09-13 test --locked -p terra-runtime --test native_boundary --target x86_64-unknown-linux-gnu
      - name: KVM gates
        run: |
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo '::notice title=KVM gates skipped::This hosted runner has no read/write /dev/kvm.'
            exit 0
          fi
          make test-component-boot
          make test-component-vmm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terra-x86_64-linux
          path: dist

  linux-aarch64:
    needs: guest-assets
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-guest-aarch64
          path: build
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Install component build tools
        run: |
          rustup target add aarch64-unknown-linux-musl
          rustup toolchain install nightly-2026-09-13 --profile minimal --component rustfmt,clippy --target wasm32-wasip3
          cargo install wasm-tools --version 1.248.0 --locked --target "$(rustc -vV | sed -n 's/^host: //p')"
      - name: Build and verify native ARM target
        run: |
          make host-dist
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          make verify-components
          ./dist/terra --version
          ./dist/terra --help
      - name: KVM product gates
        run: |
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo '::notice title=KVM gates skipped::This hosted runner has no read/write /dev/kvm.'
            exit 0
          fi
          TERRA_BIN="$PWD/dist/terra" cargo test --locked -p terra --test boot --test memory -- --ignored --test-threads=1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terra-aarch64-linux
          path: dist

  macos-aarch64:
    needs: guest-assets
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-guest-aarch64
          path: build
      - name: Install component build tools
        run: |
          rustup toolchain install nightly-2026-09-13 --profile minimal --component rustfmt,clippy --target wasm32-wasip3
          cargo install wasm-tools --version 1.248.0 --locked --target "$(rustc -vV | sed -n 's/^host: //p')"
      - name: Build and sign
        run: |
          make TERRA_TARGET=aarch64-apple-darwin host-dist
          codesign --force --sign - --entitlements packaging/macos.entitlements dist/terra
          codesign --verify --strict --verbose=2 dist/terra
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          ./dist/terra --version
          ./dist/terra --help
      - name: Native VM acceptance
        if: ${{ inputs.native_vm_tests }}
        run: TERRA_BIN="$PWD/dist/terra" cargo test --locked -p terra --test native_boot -- --ignored --nocapture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terra-aarch64-macos
          path: dist

  windows:
    needs: guest-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            guest: x86_64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            guest: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Enable Git symlinks
        run: git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-guest-${{ matrix.guest }}
          path: build
      - name: Build distribution
        shell: pwsh
        run: ./scripts/build-host.ps1 -Target ${{ matrix.target }}
      - name: Check native target
        shell: pwsh
        run: |
          cargo check --locked --workspace --all-targets --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Run workspace unit tests
        shell: pwsh
        run: cargo test --locked --workspace
      - name: Check distribution
        shell: pwsh
        run: |
          ./dist/terra.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist/terra.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native VM acceptance
        if: ${{ inputs.native_vm_tests }}
        shell: pwsh
        run: |
          $env:TERRA_BIN = (Resolve-Path ./dist/terra.exe).Path
          cargo test --locked -p terra --test native_boot -- --ignored --nocapture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terra-${{ matrix.target }}
          path: dist
