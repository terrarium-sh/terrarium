name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release_sources: true

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-x86_64-linux
          path: stage/terra-x86_64-linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-aarch64-macos
          path: stage/terra-aarch64-macos
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-aarch64-linux
          path: stage/terra-aarch64-linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-x86_64-pc-windows-msvc
          path: stage/terra-x86_64-pc-windows-msvc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-aarch64-pc-windows-msvc
          path: stage/terra-aarch64-pc-windows-msvc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-source
          path: stage
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-alpine-source-aarch64
          path: stage
      - name: Assemble platform archives
        run: |
          for directory in stage/*/; do
            tar -czf "${directory%/}.tar.gz" -C "$directory" .
          done
      - name: Checksums
        run: |
          cd stage
          sha256sum terra-*.tar.gz > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: stage/*.tar.gz
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            stage/terra-*.tar.gz \
            stage/SHA256SUMS
