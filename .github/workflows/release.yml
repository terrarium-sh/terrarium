# Release pipeline. A tag push (`v*`) builds every artifact install.sh names,
# checksums them together, and publishes one GitHub Release carrying all of it.
#
# Build-only, like build.yml: no boot suite runs here (that gate is a human
# with /dev/kvm — see README.dev.md, "Release gate"). Actions are pinned by
# commit SHA as everywhere else in this repository.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # One level only. vendor/smolvm has its own submodules on ssh URLs
          # that this build never touches, and recursing would fail to fetch them.
          submodules: true
          persist-credentials: false
      - name: Kernel build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            flex bison bc libelf-dev libssl-dev python3-pyelftools
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -U -r true
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target
          key: release-${{ matrix.arch }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Guest image inputs
        id: guest
        run: >-
          echo "key=${{ matrix.arch }}-$(git rev-parse HEAD:vendor/libkrunfw)-${{
          hashFiles('pins.mk', 'Makefile', 'kernel/terrarium-hardening.config') }}"
          >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build
          key: guest-${{ steps.guest.outputs.key }}
      - name: Build
        run: make dist
      - name: Check it is static
        run: |
          file ./dist/terra | grep -q 'statically linked'
          ! ldd ./dist/terra 2>&1 | grep -q '=>'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terra-${{ matrix.arch }}-linux
          path: dist/terra
      # The macOS build embeds these rather than baking them: mke2fs -d needs a
      # user namespace, which is Linux-only. It takes the aarch64 set, so the
      # released macOS binary boots guests on the Apple Silicon it targets. The
      # .sha256 sidecars ride along: .cargo/config.toml hands them to
      # include_str!, so without them the macOS leg cannot compile.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guest-images-${{ matrix.arch }}
          path: |
            build/*.gz
            build/*.sha256
          retention-days: 7

  macos:
    # Apple Silicon only (libkrun on macOS is aarch64-only). Build-only: hosted
    # macOS runners are VMs without nested virtualization, so nothing boots here.
    runs-on: macos-latest
    needs: linux
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true # see the note in the linux job
          persist-credentials: false
      # `.cargo/config.toml` forces CC to the zig musl wrapper, because libkrun's
      # init-blob compiles its *guest* init (always Linux/musl) whatever the host
      # is. So the macOS build needs zig too.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target
          key: release-macos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: guest-images-aarch64
          path: build
      #   --target ...  .cargo/config.toml defaults to the Linux musl target.
      #   -p terra      not `--workspace`: terra-agent's *binary* is the guest
      #                 init and only ever builds for Linux; its library is
      #                 part of this build.
      - name: Build
        run: cargo build --release -p terra --target aarch64-apple-darwin
      - name: Check it runs
        run: |
          ./target/aarch64-apple-darwin/release/terra --version
          ./target/aarch64-apple-darwin/release/terra --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terra-aarch64-macos
          path: target/aarch64-apple-darwin/release/terra

  release:
    runs-on: ubuntu-latest
    needs: [linux, macos]
    permissions:
      # The one job that publishes: everything else in this workflow can only read.
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: terra-*
          merge-multiple: false
          path: artifacts
      - name: Stage assets under their release names
        run: |
          mkdir stage
          cp artifacts/terra-x86_64-linux/terra   stage/terra-x86_64-linux
          cp artifacts/terra-aarch64-linux/terra  stage/terra-aarch64-linux
          cp artifacts/terra-aarch64-macos/terra  stage/terra-aarch64-macos
      - name: Checksums
        run: |
          cd stage
          sha256sum terra-x86_64-linux terra-aarch64-linux terra-aarch64-macos > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            stage/terra-x86_64-linux \
            stage/terra-aarch64-linux \
            stage/terra-aarch64-macos \
            stage/SHA256SUMS
