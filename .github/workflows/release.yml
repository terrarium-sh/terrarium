name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release_sources: true

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-x86_64-linux
          path: stage/terra-x86_64-linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-aarch64-macos
          path: stage/terra-aarch64-macos
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-aarch64-linux
          path: stage/terra-aarch64-linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-x86_64-pc-windows-msvc
          path: stage/terra-x86_64-pc-windows-msvc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-aarch64-pc-windows-msvc
          path: stage/terra-aarch64-pc-windows-msvc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-source
          path: stage
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-alpine-source-aarch64
          path: stage
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: terra-seccomp-*-unknown-linux-musl
          path: policies
      - name: Assemble validated policy assets
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp2
          chmod 755 stage/terra-x86_64-linux/terra stage/terra-aarch64-linux/terra
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            policy="policies/terra-seccomp-$target"
            if [ ! -d "$policy" ] && [ -f policies/terra.seccomp-manifest.json ]; then
              policy=policies
            fi
            if [ ! -d "$policy" ]; then
              echo "No validated policy artifact for $target."
              continue
            fi
            arch="${target%%-*}"
            if ! python3 scripts/verify-seccomp-artifact.py "$policy" "stage/terra-$arch-linux/terra" "$target"; then
              echo "Policy artifact did not match the release executable for $target; skipped."
              continue
            fi
            tar -czf "stage/terra-seccomp-$target.tar.gz" -C "$policy" \
              terra.seccomp.json terra.seccomp.bpf terra.seccomp-manifest.json
          done
      - name: Assemble platform archives
        run: |
          for directory in stage/*/; do
            tar -czf "${directory%/}.tar.gz" -C "$directory" .
          done
      - name: Checksums
        run: |
          cd stage
          shopt -s nullglob
          assets=(terra-*.tar.gz)
          sha256sum "${assets[@]}" > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: stage/*.tar.gz
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(stage/terra-*.tar.gz)
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            "${assets[@]}" \
            stage/SHA256SUMS
