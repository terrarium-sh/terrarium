name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -U -r true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Install component build tools
        run: |
          rustup toolchain install nightly-2026-09-07 --profile minimal --component rustfmt clippy --target wasm32-wasip3
          cargo install wasm-tools --version 1.248.0 --locked --target "$(rustc -vV | sed -n 's/^host: //p')"
      - name: Verify and build distribution
        run: |
          make verify
          make dist
          make source-dist
      - name: KVM gates
        run: |
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo '::notice title=KVM gates skipped::This hosted runner has no read/write /dev/kvm.'
            exit 0
          fi
          make test-component-boot
          make test-component-vmm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terra-x86_64-linux
          path: dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terra-source
          path: build/terra-source.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terra-guest-x86_64
          path: |
            build/vmlinux.gz
            build/rootfs.img.gz
            build/volume.img.gz
            build/boot.img.gz
            build/vmlinux.gz.sha256
            build/boot.img.gz.sha256

  guest-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -U -r true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - run: |
          rustup target add aarch64-unknown-linux-musl
          make ARCH=aarch64 guest-assets
          scripts/alpine-sources.sh
          mv build/alpine-corresponding-source.tar.gz build/terra-alpine-aarch64-source.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terra-guest-aarch64
          path: |
            build/vmlinux.gz
            build/rootfs.img.gz
            build/volume.img.gz
            build/boot.img.gz
            build/vmlinux.gz.sha256
            build/boot.img.gz.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terra-alpine-source-aarch64
          path: build/terra-alpine-aarch64-source.tar.gz

  macos-aarch64:
    needs: guest-aarch64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-guest-aarch64
          path: build
      - name: Install component build tools
        run: |
          rustup toolchain install nightly-2026-09-07 --profile minimal --component rustfmt clippy --target wasm32-wasip3
          cargo install wasm-tools --version 1.248.0 --locked --target "$(rustc -vV | sed -n 's/^host: //p')"
      - name: Build and check entitlement
        run: |
          make TERRA_TARGET=aarch64-apple-darwin host-dist
          codesign --force --sign - --entitlements packaging/macos.entitlements dist/terra
          codesign --verify --strict --verbose=2 dist/terra
          ./dist/terra --version
          ./dist/terra --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terra-aarch64-macos
          path: dist

  linux-aarch64:
    needs: guest-aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-guest-aarch64
          path: build
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Install component build tools
        run: |
          rustup target add aarch64-unknown-linux-musl
          rustup toolchain install nightly-2026-09-07 --profile minimal --component rustfmt clippy --target wasm32-wasip3
          cargo install wasm-tools --version 1.248.0 --locked --target "$(rustc -vV | sed -n 's/^host: //p')"
      - name: Build distribution
        run: make host-dist
      - name: Check distribution
        run: |
          ./dist/terra --version
          ./dist/terra --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terra-aarch64-linux
          path: dist

  windows:
    needs: [linux, guest-aarch64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            guest: x86_64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            guest: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Enable Git symlinks
        run: git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-guest-${{ matrix.guest }}
          path: build
      - name: Build distribution
        shell: pwsh
        run: ./scripts/build-host.ps1 -Target ${{ matrix.target }}
      - name: Check distribution
        shell: pwsh
        run: |
          ./dist/terra.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist/terra.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terra-${{ matrix.target }}
          path: dist

  release:
    runs-on: ubuntu-latest
    needs: [linux, linux-aarch64, macos-aarch64, windows]
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-x86_64-linux
          path: stage/terra-x86_64-linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-aarch64-macos
          path: stage/terra-aarch64-macos
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-aarch64-linux
          path: stage/terra-aarch64-linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-x86_64-pc-windows-msvc
          path: stage/terra-x86_64-pc-windows-msvc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-aarch64-pc-windows-msvc
          path: stage/terra-aarch64-pc-windows-msvc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-source
          path: stage
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terra-alpine-source-aarch64
          path: stage
      - name: Assemble platform archives
        run: |
          for directory in stage/terra-x86_64-linux stage/terra-aarch64-linux stage/terra-aarch64-macos stage/terra-x86_64-pc-windows-msvc stage/terra-aarch64-pc-windows-msvc; do
            tar -czf "$directory.tar.gz" -C "$directory" .
          done
      - name: Checksums
        run: |
          cd stage
          sha256sum terra-*.tar.gz > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: stage/*.tar.gz
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            stage/terra-*.tar.gz \
            stage/SHA256SUMS
