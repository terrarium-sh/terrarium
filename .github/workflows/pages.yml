name: Pages

on:
  push:
    branches: [main]
    paths:
      - web/**
      - docs/**
      - crates/**
      - install.sh
      - install.ps1
      - README.md
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - web/**
      - docs/**
      - crates/**
      - install.sh
      - install.ps1
      - README.md
      - .github/workflows/pages.yml
  release:
    types: [published, edited]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.event.repository.default_branch }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - name: Download command reference binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          mkdir -p "$RUNNER_TEMP/terra-reference"
          gh release download "$release" --repo "$GITHUB_REPOSITORY" \
            --pattern terra-x86_64-linux.tar.gz --pattern SHA256SUMS \
            --dir "$RUNNER_TEMP/terra-reference"
          cd "$RUNNER_TEMP/terra-reference"
          grep '  terra-x86_64-linux.tar.gz$' SHA256SUMS | sha256sum --check --strict
          tar -xzf terra-x86_64-linux.tar.gz
          chmod +x terra
          echo "TERRA_RELEASE_TAG=$release" >> "$GITHUB_ENV"
          echo "TERRA_BIN=$RUNNER_TEMP/terra-reference/terra" >> "$GITHUB_ENV"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - run: pnpm --dir web generate && pnpm --dir web check && pnpm --dir web test
      - run: pnpm --dir web build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
