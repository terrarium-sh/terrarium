<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>terrarium — under construction</title>
<style>
  body {
    margin: 0;
    box-sizing: border-box;
    min-height: 100vh;
    padding: 3rem 1.5rem;
    display: grid;
    place-content: center;
    text-align: center;
    background: #f9f6ed;
    color: #2b2a26;
    font: 1rem/1.6 system-ui, sans-serif;
  }
  main { max-width: 56rem; }
  .pot { font-size: 4rem; }
  h1 {
    margin: 0.5rem 0 0;
    font-size: clamp(2.75rem, 10vw, 4.5rem);
    line-height: 1.1;
    letter-spacing: -0.05em;
  }
  .faded { opacity: 0.35; }
  p { margin: 0; }
  .status {
    margin-top: 1.25rem;
    color: #8a4b0f;
    font: 600 1.05rem/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .tagline { margin-top: 2.5rem; font-size: 1.4rem; font-weight: 500; line-height: 1.4; }
  .philosophy { max-width: 64ch; margin: 1rem auto 0; color: #68655d; }
  .source {
    margin-top: 2.5rem;
    font-size: 0.875rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    align-items: center;
  }
  a { color: inherit; }
</style>
</head>
<body>
  <main>
    <div class="pot" aria-hidden="true">🪴</div>
    <h1>terra<span class="faded">rium</span></h1>
    <p class="status">🚧 Under construction 🚧</p>
    <p class="tagline">Give your agent room to work. Decide what it can touch.</p>
    <p class="philosophy">A small, auditable core. Extend it with recipes,
      hooks, and your own tools.</p>
    <div class="source">
      <a href="https://github.com/terrarium-sh/terrarium">View on GitHub &rarr;</a>
      <a href="https://discord.gg/CQDEtqxPwJ">Join the Discord &rarr;</a>
    </div>
  </main>
</body>
</html>
