[workspace]
resolver = "3"
members = ["crates/terra", "crates/terra-agent", "crates/terra-protocol", "crates/terra-io", "crates/terra-runtime", "crates/terra-platform", "crates/terra-network", "crates/terra-limits", "components/vsock-device"]
exclude = ["vendor", "components", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Berry-Studio/terrarium"
rust-version = "1.95"

[workspace.dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
yaml_serde = "0.10"
serde_json = "1"
anyhow = "1"
libc = "0.2"
linux-raw-sys = { version = "0.12", default-features = false, features = ["general"] }
rustix = { version = "1", default-features = false, features = ["std", "event", "fs", "mount", "net", "param", "pipe", "process", "rand", "runtime", "stdio", "system", "termios", "thread", "time"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
warnings = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
strip = "symbols"
overflow-checks = true
debug-assertions = true
panic = "abort"
