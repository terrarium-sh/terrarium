[package]
name = "terra-fs-component"
version = "0.1.0"
edition = "2024"

[workspace]

[lints.rust]
unsafe_code = "deny"
warnings = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
terra-device-transport = { path = "../device-transport" }
terra-limits = { path = "../../crates/terra-limits" }
wit-bindgen = { version = "=0.62.0", features = ["async-spawn", "inter-task-wakeup", "futures-stream"] }
futures = "0.3"

[profile.release]
overflow-checks = true
panic = "abort"
