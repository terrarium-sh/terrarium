[package]
name = "terra-boot-component"
version = "0.1.0"
edition = "2024"

[workspace]

[lints.rust]
unsafe_code = "deny"
warnings = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[lib]
crate-type = ["cdylib"]

[dependencies]
vm-fdt = { version = "0.3", default-features = false, features = ["alloc"] }
wit-bindgen = "=0.62.0"
terra-limits = { path = "../../crates/terra-limits" }

[profile.release]
overflow-checks = true
panic = "abort"
