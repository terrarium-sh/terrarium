[package]
name = "terra-policy-component"
version = "0.1.0"
edition = "2024"

[workspace]

[lints.rust]
unsafe_code = "deny"
warnings = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[lib]
crate-type = ["cdylib"]

[dependencies]
lru = "0.18"
terra-network = { path = "../../crates/terra-network" }
wit-bindgen = "=0.61.1"

[profile.release]
overflow-checks = true
panic = "abort"
