[package]
name = "terra-policy-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
arbitrary = { version = "1.4.2", features = ["derive"] }
serde_json = "1"
serde = "1"
terra = { path = "../crates/terra", features = ["fuzzing"] }
terra-runtime = { path = "../crates/terra-runtime", features = ["test-support"] }
terra-protocol = { path = "../crates/terra-protocol" }
terra-policy = { path = "../crates/terra-policy" }
terra-device-transport = { path = "../components/device-transport" }
terra-agent-component = { path = "../components/agent", features = ["fuzzing"] }
terra-vsock-device = { path = "../components/vsock-device", features = ["fuzzing"] }
terra-vsock-frontend-component = { path = "../components/vsock-frontend", features = ["fuzzing"] }
terra-fs-component = { path = "../components/fs" }
wasmtime = { version = "=49.0.2", default-features = false, features = ["std"] }

[[bin]]
name = "network_policy"
path = "fuzz_targets/network_policy.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "native_memory"
path = "fuzz_targets/native_memory.rs"
test = false
doc = false
bench = false

[[bin]]
name = "device_queue"
path = "fuzz_targets/device_queue.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuse_wire"
path = "fuzz_targets/fuse_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "network_application"
path = "fuzz_targets/network_application.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_frames"
path = "fuzz_targets/protocol_frames.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "deny"
warnings = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[[bin]]
name = "vsock_packets"
path = "fuzz_targets/vsock_packets.rs"
test = false
doc = false
bench = false
