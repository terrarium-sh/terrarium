[package]
name = "terra-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
terra-platform = { path = "../terra-platform" }
anyhow.workspace = true
libc.workspace = true
log = "0.4.34"
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.11", default-features = false }
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "=0.5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Threading"] }

[build-dependencies]
terra-build = { path = "../terra-build" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
linux-raw-sys.workspace = true

[lints]
workspace = true
