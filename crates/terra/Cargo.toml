[package]
name = "terra"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# `examples/gen-docs.rs` renders man pages and completions from the same clap
# types the binary parses with; examples reach those only through a lib target.
[lib]
name = "terra"
path = "src/lib.rs"

[[bin]]
name = "terra"
path = "src/main.rs"

[dependencies]
terra-shared = { path = "../terra-shared" }
clap.workspace = true
strum = { version = "0.28", features = ["derive"] }
anyhow.workspace = true
serde.workspace = true
yaml_serde.workspace = true
serde_json = { workspace = true }
crossterm = { version = "0.29", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libkrun = { path = "../../vendor/libkrun/src/libkrun", features = ["net", "blk"] }
smolvm-network = { path = "../../vendor/smolvm/crates/smolvm-network" }
libc.workspace = true
sha2 = { version = "0.11", default-features = false }
tracing = "0.1.44"
tracing-appender = "0.2"
log = "0.4.33"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "tracing-log", "std"] }

[dev-dependencies]
clap_mangen = "0.3"
clap_complete = "4"
tempfile.workspace = true

[lints]
workspace = true
