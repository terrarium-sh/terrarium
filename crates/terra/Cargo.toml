[package]
name = "terra"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# `examples/gen-docs.rs` renders man pages and completions from the same clap
# types the binary parses with; examples reach those only through a lib target.
[lib]
name = "terra"
path = "src/lib.rs"

[[bin]]
name = "terra"
path = "src/main.rs"

[features]
fuzzing = []

[dependencies]
terra-io = { path = "../terra-io" }
terra-limits = { path = "../terra-limits" }
terra-protocol = { path = "../terra-protocol" }
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
yaml_serde.workspace = true
serde_json = { workspace = true }
crossterm = { version = "0.29", default-features = false, features = ["windows"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
terra-network = { path = "../terra-network" }
terra-runtime = { path = "../terra-runtime" }
terra-platform = { path = "../terra-platform" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
libc.workspace = true
rustix.workspace = true
sha2 = { version = "0.11", default-features = false }
tracing-appender = "0.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
log = "0.4.34"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "tracing-log", "std"] }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
clap_mangen = "0.3"
clap_complete = "4"
tempfile.workspace = true

[lints]
workspace = true
