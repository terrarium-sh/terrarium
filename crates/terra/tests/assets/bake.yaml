# on_create runs once, on the fresh root: the same box booted twice must print
# the same WHEN.
hw: {rootfs_mib: 1024}
hooks:
  on_create:
    - mkdir -p /opt/baked
    - date +%s%N > /opt/baked/when
workload:
  entrypoint: /bin/sh
  args:
    - "-c"
    - |
      echo "WHEN=$(cat /opt/baked/when)"
