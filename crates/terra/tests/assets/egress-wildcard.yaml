# The subtree is opted into, not implied: `*.example.com` covers the subdomains
# and deliberately not the name itself. List both to get both.
network:
  mode: allowlist
  allow: ["*.example.com"]
workload:
  entrypoint: /bin/sh
  args:
    - "-c"
    - |
      # Any HTTP answer, even a CDN's 503, proves the policy let the name through.
      reach() { err=$(wget -q -T 10 -O /dev/null "$1" 2>&1) || { echo "$err"; case $err in *"server returned error"*) ;; *) return 1 ;; esac; }; }
      reach https://www.example.com/ && echo SUB_OK       || echo SUB_FAIL
      reach https://example.com/     && echo APEX_REACHED || echo APEX_BLOCKED
