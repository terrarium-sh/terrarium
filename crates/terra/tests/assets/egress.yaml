# Egress allowlist: a name is *exact*. `example.com` reaches that name and
# neither its subdomains nor anything else.
network:
  mode: allowlist
  allow: [example.com]
workload:
  entrypoint: /bin/sh
  args:
    - "-c"
    - |
      # Any HTTP answer, even a CDN's 503, proves the policy let the name through.
      reach() { err=$(wget -q -T 10 -O /dev/null "$1" 2>&1) || { echo "$err"; case $err in *"server returned error"*) ;; *) return 1 ;; esac; }; }
      reach https://example.com/     && echo ALLOWED_OK     || echo ALLOWED_FAIL
      reach https://www.example.com/ && echo SUB_REACHED    || echo SUB_BLOCKED
      reach https://api.openai.com/  && echo DENIED_REACHED || echo DENIED_BLOCKED
