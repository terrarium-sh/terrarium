[package]
name = "terra-hypervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
log = "0.4.34"
terra-limits = { path = "../terra-limits" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix.workspace = true
vm-memory = { version = "0.18", features = ["backend-mmap"] }

[target.'cfg(target_os = "linux")'.dependencies]
kvm-bindings = "0.14"
kvm-ioctls = "0.25"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
applevisor = { version = "=1.0.0", default-features = false, features = ["macos-15-0"] }
applevisor-sys = { version = "=1.0.0", default-features = false, features = ["macos-15-0"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Hypervisor", "Win32_System_Memory", "Win32_System_SystemInformation"] }

[lints]
workspace = true
