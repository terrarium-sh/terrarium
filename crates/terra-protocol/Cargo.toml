[package]
name = "terra-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_bytes = "0.11"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
tokio = { version = "1", default-features = false, features = ["io-util"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std", "io"], optional = true }
yamux = { version = "=0.14.1", optional = true }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"], optional = true }
lz4 = { version = "1", optional = true }

[features]
tokio = ["dep:tokio"]
futures-io = ["dep:futures-util"]
mux = ["dep:yamux"]
packed-image = ["dep:lz4_flex"]
packer = ["packed-image", "dep:lz4"]
test-support = []

[[example]]
name = "pack-guest-image"
required-features = ["packer"]

[[example]]
name = "guest-identity"
test = true

[dev-dependencies]
tempfile.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "rt"] }

[lints]
workspace = true
