[package]
name = "terra-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_bytes = "0.11"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
tokio = { version = "1", default-features = false, features = ["io-util"], optional = true }
yamux = { version = "=0.14.1", optional = true }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"], optional = true }
crc32fast = { version = "1", features = ["std"], optional = true }
lz4 = { version = "1", optional = true }

[features]
tokio = ["dep:tokio"]
mux = ["dep:yamux"]
packed-image = ["dep:lz4_flex", "dep:crc32fast"]
packer = ["packed-image", "dep:lz4"]
test-support = ["packed-image"]

[[example]]
name = "repack-guest-image"
required-features = ["packer"]

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "rt"] }

[lints]
workspace = true
