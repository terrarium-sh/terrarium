[package]
name = "terra-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# The shipped device runtime only deserializes artifacts produced by the
# trusted build. Keep Cranelift out of that dependency graph.
compiler = ["wasmtime/cranelift"]
thread-experiments = ["wasmtime/threads"]
test-support = []

[dependencies]
terra-platform = { path = "../terra-platform" }
terra-protocol = { path = "../terra-protocol" }
futures-util = { version = "0.3", default-features = false, features = ["alloc", "std"] }
notify = "8.2"
terra-limits = { path = "../terra-limits" }
log = "0.4.34"
target-lexicon = "0.13"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
wasmtime = { version = "=48.0.2", default-features = false, features = ["async", "component-model-async", "runtime", "std"] }
wasmtime-wasi = { version = "=48.0.2", default-features = false, features = ["p3"] }

[dev-dependencies]
terra-protocol = { path = "../terra-protocol", features = ["mux"] }
tokio = { version = "1", features = ["test-util"] }
futures-channel = "0.3"
yamux = "=0.14.1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Integration tests link the library without cfg(test).
terra-runtime = { path = ".", features = ["test-support"] }
virtio-bindings = "0.2.7"
terra-vsock-device = { path = "../../components/vsock-device" }
tempfile = { workspace = true }
# Core-Wasm spike tests compile WAT and components; release builds do not.
wasmtime = { version = "=48.0.2", default-features = false, features = ["cranelift", "wit-parser", "wat"] }

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true
vm-memory = { version = "0.18", features = ["backend-mmap"] }
virtio-blk = { git = "https://github.com/rust-vmm/vm-virtio", rev = "87bf424736548126983c278b0d49a7b061e38b12" }
virtio-queue-git = { package = "virtio-queue", git = "https://github.com/rust-vmm/vm-virtio", rev = "87bf424736548126983c278b0d49a7b061e38b12", features = ["test-utils"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[[test]]
name = "shared_component_memory"
required-features = ["thread-experiments"]

[[test]]
name = "shared_worker_memory"
required-features = ["thread-experiments"]

[[example]]
name = "precompile-component"
required-features = ["compiler"]

[lints]
workspace = true
