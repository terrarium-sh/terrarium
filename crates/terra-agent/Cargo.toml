[package]
name = "terra-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["io", "std"] }
sha2 = { version = "0.11", default-features = false }
terra-protocol = { path = "../terra-protocol", features = ["tokio", "mux"] }
yamux = "0.14.1"

[target.'cfg(target_os = "linux")'.dependencies]
linux-raw-sys.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt", "compat"] }
async-io = "2.6"
pty-process = "0.5"
rustix.workspace = true
# Terminal screen model so a client attaching to a running TUI gets repainted
# with the current screen instead of missing history.
vt100 = "0.16"

[lints]
workspace = true
