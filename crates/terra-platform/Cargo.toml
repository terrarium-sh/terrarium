[package]
name = "terra-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
tokio = { version = "1", features = ["net", "io-util"] }
rustix.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
cap-primitives = "=4.0.3"
uds_windows = "1.2.1"
tempfile.workspace = true
tokio = { version = "1", features = ["io-util", "rt"] }
async-io = "2.6.0"
tokio-util = { version = "0.7", features = ["compat"] }
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Networking_WinSock", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
